name: Enable Auto-Merge

on:
  pull_request:
    types:
      - opened
      - ready_for_review

permissions: { }

jobs:
  enable-auto-merge:
    if: github.event.pull_request.user.login == 'SlashNephy' || github.actor == 'SlashNephy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: gh pr merge --merge --auto "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.SLASHNEPHY_GITHUB_TOKEN }}
        continue-on-error: true
