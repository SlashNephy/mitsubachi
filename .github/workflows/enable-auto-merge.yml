name: Enable Auto-Merge

on:
  pull_request:
    types:
      - opened
      - ready_for_review

permissions: { }

jobs:
  enable-auto-merge:
    if: github.event.pull_request.user.login == 'SlashNephy' || github.actor == 'SlashNephy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: gh pr merge --merge --auto "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.SLASHNEPHY_GITHUB_TOKEN }}
        continue-on-error: true
